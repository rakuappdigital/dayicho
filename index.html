<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Dayıço Runner</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrap">
    <div id="hud">
      <div id="score">PUAN: 0</div>
      <div id="best">EN İYİ: 0</div>
    </div>
    <canvas id="game" width="400" height="700"></canvas>

    <div id="startScreen" class="overlay">
      <img src="assets/dayico_face.png" class="faceBig" alt="Dayıço" />
      <h1>DAYIÇO <span class="runner">RUNNER</span></h1>
      <p class="sub">Fluence'la trafikte hayatta kal, atkıyı topla!</p>
      <button id="startBtn">BAŞLA</button>
      <p class="hint">← → ya da A D ile şerit değiştir (mobilde kaydır)</p>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
      <h1 class="goTitle">OLAY ÇIKTI DAYIÇO!</h1>
      <p id="finalScore" class="sub">PUAN: 0</p>
      <p id="newBest" class="newBest hidden">YENİ REKOR!</p>
      <button id="retryBtn">TEKRAR OYNA</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
